[package]
documentation = "https://route-info-builder.vercel.app"

name = "route-info-builder"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Build-time route scanner for Axum-like frameworks: generates type-safe Rust link enums, TypeScript clients & TanStack Query hooks, OpenAPI 3.1 skeletons and JSON route maps."
license = "MIT"
readme = "README.md"
repository = "https://github.com/elcoosp/route-info-builder"
keywords = ["http", "router", "web", "axum", "route"]
categories = ["development-tools", "web-programming"]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE-MIT", "/CHANGELOG.md", "/cliff.toml"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", optional = true, features = ["derive"] }
convert_case = "0.12.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit"] }
thiserror = "2.0.21"
toml = "1.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "route-info-builder"
path = "src/main.rs"
required-features = ["cli"]

[lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
